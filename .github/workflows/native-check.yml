name: Check native Apple authentication integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/native-check.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build backend TypeScript
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Verify native PTY login, 2FA and keychain flow
        working-directory: backend
        run: npm test -- src/services/nativeIpatool.test.ts
      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

  native-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Verify pinned ipatool stage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: native-ipatool
          platforms: linux/amd64
          push: false

  complete-image:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build complete integrated AssppWeb Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: assppweb-native-integration:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check native CLI is embedded in main image
        run: docker run --rm --entrypoint /usr/local/bin/ipatool assppweb-native-integration:test --version

      - name: Smoke test Node backend and packaged frontend
        run: |
          docker run -d --name asspp-native-smoke \
            -e UNSAFE_DANGEROUSLY_DISABLE_HTTPS_REDIRECT=true \
            -e DATA_DIR=/data \
            -p 127.0.0.1:18080:8080 assppweb-native-integration:test
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/api/settings >/dev/null; then
              docker rm -f asspp-native-smoke
              exit 0
            fi
            sleep 2
          done
          docker logs asspp-native-smoke
          docker rm -f asspp-native-smoke
          exit 1
