name: Check native Apple authentication integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/native-check.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build backend TypeScript
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

  native-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Verify pinned ipatool stage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: native-ipatool
          platforms: linux/amd64
          push: false
