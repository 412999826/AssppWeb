# Optional native authentication / IPA download fallback.
# This is a separate CLI; it does not fix or replace browser-side AssppWeb auth.
services:
  ipatool:
    image: ghcr.io/412999826/assppweb-ipatool:2.8.1
    profiles:
      - ipatool
    environment:
      HOME: /data
      XDG_CACHE_HOME: /data/.cache
      XDG_CONFIG_HOME: /data/.config
    volumes:
      - ./mnt/ipatool-data:/data
    stdin_open: true
    tty: true
